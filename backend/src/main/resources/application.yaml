spring:
  application:
    name: iatros-backend

  datasource:
    url: ${IATROS_DB_URL:jdbc:postgresql://localhost:5432/iatros}
    username: ${IATROS_DB_USERNAME:iatros}
    password: ${IATROS_DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Server-side sessions in PostgreSQL (decisions.md D-010). Tables come from Flyway V10.
  session:
    jdbc:
      initialize-schema: never

  messages:
    basename: i18n/messages
    fallback-to-system-locale: false

  # Documents are at most 20 MB (decisions.md D-032); the request allows for the multipart envelope.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

iatros:
  security:
    # Session and CSRF cookie attributes are set in SessionConfig / SecurityConfig.
    secure-cookies: true
    session-idle-timeout: 30m
    session-max-lifetime: 12h
  mail:
    transport: smtp
  documents:
    # Outside the source tree, and backed up together with the database.
    local-dir: ${IATROS_DOCUMENTS_DIR:}
    max-size: 20MB

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
